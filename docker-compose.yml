version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: pos_kopitiam_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_HOST=%
    env_file:
      - .env
    ports:
      - "4406:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
    driver: local
