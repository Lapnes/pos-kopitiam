services:
  mysql:
    image: mysql:8.4
    container_name: pos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: popoi
      MYSQL_DATABASE: pos_kopitiam
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pos_redis
    ports:
      - "6379:6379"
